<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Page</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        background: #f7f7f7;
      }

      .wrapper {
        width: 780px;
        margin: 50px auto;
        border-radius: 8px;
        overflow: hidden;
      }

      .navbarCNT {
        width: 100%;
        height: 72px;
        background: #e40046;
        color: white;
        display: flex;
        padding: 0px 20px;
        display: flex;
        align-items: center;
      }

      .navbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        height: 24px;
        width: 780px;
      }

      .navbar p {
        font-size: 24px;
        line-height: 18px;
        font-weight: 700;
        font-family: Inter, lato, ubuntu, helvetica, sans-serif !important;
      }

      .container {
        width: 100%;
        height: 660px;
        display: flex;
      }

      .leftSection {
        width: 52%;
        min-height: 585px;
        border-right: 1px solid #e5e5e5;
        position: relative;
        background: white;
      }

      .topbar {
        border-right: 1px solid var(--border-grey-color);
        box-shadow: 0 7px 9px -5px #171a1e26;
        height: 56px;
        justify-content: flex-start;
        padding: 0px 24px;
        display: flex;
        align-items: center;
      }

      .contactDetailsCNT {
        min-height: 499px;
        padding: 8px 0 0;
        border-bottom: 1px solid #e5e5e5;
      }

      .contactDetails {
        padding: 16px 24px;
        font-size: 14px;
        font-family: Inter, lato, ubuntu, helvetica, sans-serif !important;
        border-bottom: 1px solid #e5e5e5;
      }

      .phoneBox {
        position: relative;
        width: 100%;
        margin-top: 20px;
      }

      .phoneBox label {
        position: absolute;
        top: -8px;
        left: 12px;
        background: white;
        padding: 0 5px;
        font-size: 12px;
        font-weight: 500;
        color: #e40046;
        z-index: 1;
      }

      .inputBox {
        width: 100%;
        height: 46px;
        border: 1px solid #e40046;
        border-radius: 4px;
        display: flex;
        overflow: hidden;
        background: #fff;
      }

      .countryCode {
        width: 78px;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 12px;
        border-right: 1px solid #d9d9d9;
        color: #333;
        font-size: 14px;
      }

      .countryCode span {
        font-size: 10px;
        color: #666;
      }

      .inputBox input {
        flex: 1;
        border: none;
        outline: none;
        padding: 0 14px;
        font-size: 16px;
        color: #333;
      }

      .inputBox input::placeholder {
        color: #999;
      }

      .checkboxBox {
        margin-top: 12px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .checkboxBox input[type="checkbox"] {
        width: 16px;
        height: 16px;
        accent-color: #e40046;
        cursor: pointer;
      }

      .checkboxBox label {
        position: static;
        background: transparent;
        padding: 0;
        color: #666;
        font-size: 14px;
        font-weight: 400;
        cursor: pointer;
      }

      .BTNcontainer {
        padding: 10px 24px;
        font-size: 16px;
        box-shadow: 0 -8px 12px 0 rgba(21, 45, 75, 0.102);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      button {
        background: #e40046;
        color: #ffffff;
        font-size: 14px;
        font-weight: 600;
        padding: 14px 18px;
        width: 70%;
        border: 1px;
        border-radius: 6px;
      }

      .rightSection {
        width: 48%;
        min-height: 585px;
        background: white;
        color: #171a1e;
        padding: 20px 24px;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="navbarCNT">
        <div class="navbar">
          <p>snapdeal</p>
          <div style="display: flex; margin-left: 490px; gap: 12px">
            <div style="display: flex">
              <span style="font-size: 16px">English</span>
              <img
                src="./images/keyboard_arrow_down_16dp_FFFFFF_FILL0_wght300_GRAD0_opsz20.svg"
                alt=""
              />
            </div>
            <img
              style="background: rgba(255, 255, 255, 0.15)"
              src="./images/close_20dp_FFFFFF_FILL0_wght400_GRAD0_opsz20.svg"
              alt=""
            />
          </div>
        </div>
      </div>
      <div class="container">
        <!-- left side -->
        <div class="leftSection">
          <div class="topbar">
            <span
              style="
                color: #e40046;
                font-size: 16px;
                padding: 0px 2px;
                font-family:
                  Inter, lato, ubuntu, helvetica, sans-serif !important;
              "
              >Summary
            </span>
            <img
              src="./images/keyboard_double_arrow_right_24dp_666666_FILL0_wght300_GRAD0_opsz40.svg"
              alt=""
            />
            <span
              style="
                font-size: 16px;
                padding: 0px 2px;
                font-family:
                  Inter, lato, ubuntu, helvetica, sans-serif !important;
              "
              >Address
            </span>
            <img
              src="./images/keyboard_double_arrow_right_24dp_666666_FILL0_wght300_GRAD0_opsz40.svg"
              alt=""
            />
            <span
              style="
                font-size: 16px;
                padding: 0px 2px;
                font-family:
                  Inter, lato, ubuntu, helvetica, sans-serif !important;
              "
              >Payment</span
            >
          </div>
          <div class="contactDetailsCNT">
            <div class="contactDetails">
              <div style="display: flex; align-items: center">
                <img
                  style="
                    background: rgba(182, 181, 181, 0.183);
                    border-radius: 50px;
                  "
                  src="./images/account_circle_24dp_666666_FILL0_wght400_GRAD0_opsz24.svg"
                  alt=""
                />
                <span style="font-weight: 600; padding: 0px 0px 0px 10px"
                  >Contact Details</span
                >
              </div>
              <div class="phoneBox">
                <label>Phone Number</label>
                <div class="inputBox">
                  <div class="countryCode">
                    +91
                    <span>▼</span>
                  </div>
                  <input type="text" placeholder="" />
                </div>
                <div class="checkboxBox">
                  <input type="checkbox" id="offers" checked />
                  <label for="offers">Notify me with offers and updates</label>
                </div>
              </div>
            </div>
          </div>
          <div style="padding: 12px 24px">
            <div
              style="
                font-size: 15px;
                font-weight: 500;
                font-family:
                  Inter, lato, ubuntu, helvetica, sans-serif !important;
                display: flex;
                align-items: center;
              "
            >
              Account
              <img
                src="./images/keyboard_arrow_up_16dp_000000_FILL0_wght300_GRAD0_opsz20.svg"
                alt=""
              />
            </div>
          </div>
          <div class="BTNcontainer">
            <span style="font-weight: 600; line-height: 18px; color: #171a1e"
              >₹ 167</span
            >
            <button>Continue</button>
          </div>
        </div>

        <!-- right side -->
        <div class="rightSection">
          <div>
            <span style="font-size: 16px;margin-bottom: 32px; margin-top: 0; line-height: 21px; font-weight: 600;">Order Summary</span>
            <img
              style="height: 56px; width: 56px; border: .7px solid #8d97a133; border-radius: 2px;"
              src="./images/Loopa-Black-Leather-Men-s-SDL344530276-1-bf880.jpg"
              alt=""
            />
            <div>
              <p>Loopa - Black Leather Men's...</p>
              <p>Qty: 1</p>
            </div>
            <div><p>₹167</p></div>
            <div>
              <div>Price</div>
              <div>₹167</div>
            </div>
          </div>
          <div>
            <span>Secured by</span>
            <img
              style="height: 26px; width: 26px"
              src="./images/razorpay-icon.svg"
              alt=""
            />
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
